<div class="px-4 sm:px-6 py-6 min-h-[calc(100vh-60px)] max-w-[1400px] mx-auto flex flex-col">
  
  <!-- ── Page header ── -->
  <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
    <h1 class="text-[20px] font-bold text-[#0D1B3E] m-0">Agenda Geral</h1>

    <!-- Date navigator -->
    <div class="flex items-center">
      <button class="w-8 h-8 rounded-l-lg border border-[#EEF1F8] border-r-0 bg-white flex items-center justify-center cursor-pointer hover:bg-[#F8FAFC] transition-colors">
        <i class="bi bi-chevron-left text-[#5A6A85] text-xs"></i>
      </button>
      <div class="h-8 px-4 border border-[#EEF1F8] bg-white flex items-center gap-1.5">
        <span class="text-[13px] font-semibold text-[#0D1B3E] whitespace-nowrap">Hoje</span>
        <span class="w-px h-3.5 bg-[#EEF1F8] mx-1"></span>
        <span class="text-[13px] text-[#5A6A85] whitespace-nowrap">14 de Agosto de 2026</span>
      </div>
      <button class="w-8 h-8 rounded-r-lg border border-[#EEF1F8] border-l-0 bg-white flex items-center justify-center cursor-pointer hover:bg-[#F8FAFC] transition-colors">
        <i class="bi bi-chevron-right text-[#5A6A85] text-xs"></i>
      </button>
    </div>

    <!-- New appointment button -->
    <button class="flex items-center gap-1.5 h-9 px-4 bg-[#1565C0] text-white rounded-lg text-[13px] font-semibold hover:bg-[#0D47A1] transition-colors shadow-sm">
      <i class="bi bi-plus-lg"></i> Novo Agendamento
    </button>
  </div>

  <!-- ── Filter bar ── -->
  <div class="bg-white border border-[#EEF1F8] rounded-lg px-4 py-2.5 flex items-center gap-3 mb-4 flex-wrap shadow-sm">
    <span class="text-[12px] font-semibold text-[#5A6A85] tracking-[0.04em]">FILTROS</span>
    <div class="w-px h-[18px] bg-[#EEF1F8]"></div>

    <!-- Especialidade -->
    <div class="relative">
      <select class="h-8 pl-3 pr-7 border border-[#EEF1F8] rounded-md bg-[#F8FAFC] text-[13px] text-[#0D1B3E] outline-none appearance-none cursor-pointer">
        <option>Especialidade: Todas</option>
        <option>Cardiologia</option>
        <option>Dermatologia</option>
        <option>Clínica Geral</option>
      </select>
      <i class="bi bi-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-[#5A6A85] text-xs pointer-events-none"></i>
    </div>

    <!-- Status -->
    <div class="relative">
      <select class="h-8 pl-3 pr-7 border border-[#EEF1F8] rounded-md bg-[#F8FAFC] text-[13px] text-[#0D1B3E] outline-none appearance-none cursor-pointer">
        <option>Status: Todos</option>
        <option>Aguardando</option>
        <option>Confirmado</option>
        <option>Atrasado</option>
      </select>
      <i class="bi bi-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-[#5A6A85] text-xs pointer-events-none"></i>
    </div>

    <div class="flex-1"></div>

    <!-- Doctor search -->
    <div class="relative">
      <i class="bi bi-search absolute left-2.5 top-1/2 -translate-y-1/2 text-[#5A6A85] text-xs"></i>
      <input type="text" [(ngModel)]="filterDoctor" placeholder="Filtrar médico..." class="h-8 pl-8 pr-3 border border-[#EEF1F8] rounded-md bg-[#F8FAFC] text-[13px] text-[#0D1B3E] outline-none w-[180px] focus:border-[#1565C0]/40 focus:ring-2 focus:ring-[#1565C0]/10 transition-all">
    </div>
  </div>

  <!-- ── Calendar Grid ── -->
  <div class="bg-white border border-[#EEF1F8] rounded-lg flex flex-col flex-1 min-h-0 shadow-sm overflow-hidden">
    
    <!-- Column headers row -->
    <div class="flex border-b border-[#EEF1F8] shrink-0 bg-[#FAFCFF]">
      <!-- Time gutter header -->
      <div class="w-16 min-w-[64px] border-r border-[#EEF1F8] flex items-center justify-center py-3">
        <i class="bi bi-clock text-[#5A6A85] text-sm"></i>
      </div>

      <!-- Doctor headers -->
      <div *ngFor="let doc of visibleDoctors" class="flex-1 min-w-[200px] py-3 px-4 border-r border-[#EEF1F8] last:border-r-0 flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-[14px] font-bold shrink-0" [ngStyle]="{'background-color': doc.avatarBg, 'color': doc.avatarColor}">
          {{ doc.avatarLetter }}
        </div>
        <div class="min-w-0">
          <div class="text-[13px] font-semibold text-[#0D1B3E] truncate">{{ doc.name }}</div>
          <div class="text-[11px] text-[#5A6A85] truncate">{{ doc.specialty }}</div>
        </div>
      </div>
      
      <!-- Empty state header filler -->
      <div *ngIf="visibleDoctors.length === 0" class="flex-1 py-3 px-4"></div>
    </div>

    <!-- Scrollable grid body -->
    <div class="overflow-y-auto flex-1 bg-white relative">
      <div class="flex">
        
        <!-- Time gutter -->
        <div class="w-16 min-w-[64px] border-r border-[#EEF1F8] relative shrink-0" [ngStyle]="{'height.px': TOTAL_HOURS * HOUR_HEIGHT}">
          <div *ngFor="let h of hours" class="absolute left-0 right-0 flex justify-center" [ngStyle]="{'top.px': (h - START_HOUR) * HOUR_HEIGHT - 8}">
            <span *ngIf="h < END_HOUR" class="text-[11px] font-medium text-[#94A3B8] tracking-widest tabular-nums bg-white px-1">
              {{ formatHour(h) }}
            </span>
          </div>
        </div>

        <!-- Doctor columns -->
        <ng-container *ngIf="visibleDoctors.length > 0; else emptyState">
          <div *ngFor="let doc of visibleDoctors" class="flex-1 min-w-[200px] relative border-r border-[#EEF1F8] last:border-r-0" [ngStyle]="{'height.px': TOTAL_HOURS * HOUR_HEIGHT}">
            
            <!-- Hour lines -->
            <div *ngFor="let h of hours" class="absolute left-0 right-0 h-[64px] border-t border-dashed border-[#EEF1F8]" [class.border-t-0]="h === START_HOUR" [ngStyle]="{'top.px': (h - START_HOUR) * HOUR_HEIGHT}"></div>
            
            <!-- Half-hour lines -->
            <div *ngFor="let h of hours.slice(0, -1)" class="absolute left-2 right-2 border-t border-dashed border-[#F3F6FB]" [ngStyle]="{'top.px': (h - START_HOUR) * HOUR_HEIGHT + HOUR_HEIGHT / 2}"></div>

            <!-- Appointments -->
            <div *ngFor="let appt of getApptsForDoctor(doc.id)" 
                 class="absolute left-2 right-2 rounded-md px-2.5 py-1.5 overflow-hidden cursor-pointer hover:brightness-95 transition-all flex flex-col justify-center gap-0.5 shadow-sm"
                 [ngStyle]="{
                   'top.px': getTopPx(appt) + 1,
                   'height.px': getHeightPx(appt) - 2,
                   'background-color': getStyle(appt.status).bg,
                   'border-left': '3px solid ' + getStyle(appt.status).border,
                   'background-image': appt.status === 'Bloqueio' ? 'repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(148,163,184,0.08) 4px, rgba(148,163,184,0.08) 8px)' : 'none'
                 }">
              
              <div class="text-[12px] font-semibold truncate leading-tight" [ngStyle]="{'color': getStyle(appt.status).text}">
                {{ appt.patientName }}
              </div>
              
              <div class="text-[11px] truncate leading-tight opacity-80" [ngStyle]="{'color': getStyle(appt.status).text}">
                {{ appt.type }}
              </div>
              
              <div *ngIf="getHeightPx(appt) > 40 && appt.status !== 'Bloqueio'" class="mt-0.5">
                <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded tracking-wide" [ngStyle]="{'background-color': getStyle(appt.status).badge, 'color': getStyle(appt.status).badgeText}">
                  {{ appt.status }}
                </span>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- Empty state template -->
        <ng-template #emptyState>
          <div class="flex-1 flex items-center justify-center text-[#5A6A85] text-[14px]" [ngStyle]="{'height.px': TOTAL_HOURS * HOUR_HEIGHT}">
            Nenhum médico encontrado com esse filtro.
          </div>
        </ng-template>

      </div>
    </div>
  </div>

  <!-- ── Legend ── -->
  <div class="mt-3 flex items-center gap-4 flex-wrap">
    <div *ngFor="let item of ['Aguardando', 'Confirmado', 'Atrasado', 'Bloqueio']" class="flex items-center gap-1.5">
      <div class="w-2.5 h-2.5 rounded-sm border-2" [ngStyle]="{'background-color': getStyle($any(item)).bg, 'border-color': getStyle($any(item)).border}"></div>
      <span class="text-[12px] text-[#5A6A85]">{{ item }}</span>
    </div>
  </div>
  
</div>
