<div class="flex h-screen bg-[#F0F4FA] overflow-hidden" style="font-family:Inter,system-ui,sans-serif">
  <div *ngIf="sidebarOpen" class="fixed inset-0 bg-black/30 z-30 lg:hidden" (click)="sidebarOpen = false"></div>
  <aside [ngClass]="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed lg:static top-0 left-0 h-full z-40 flex flex-col w-[232px] bg-white border-r border-[#DDE4F0] shrink-0 transition-transform">
    <div class="flex items-center gap-2.5 px-5 h-[60px] border-b border-[#DDE4F0]"><i class="bi bi-heart-pulse text-[#1565C0]"></i><span class="text-[#0D1B3E] font-bold">Conecta<span class="text-[#16A34A]">Saúde</span></span><button class="lg:hidden ml-auto" (click)="sidebarOpen = false" aria-label="Fechar menu">✕</button></div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"><button *ngFor="let item of navItems" [routerLink]="item.route" (click)="sidebarOpen = false" [ngClass]="router.url.includes(item.route) ? 'bg-[#EBF3FF] text-[#1565C0]' : 'text-[#5A6A85] hover:bg-[#F0F4FA]'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium text-left"><i [class]="'bi ' + item.icon"></i>{{ item.label }}</button></nav>
    <div class="p-4 border-t border-[#DDE4F0] flex gap-3 items-center"><div class="w-9 h-9 rounded-full bg-[#1565C0] flex items-center justify-center text-white font-bold shrink-0">{{ userInitials }}</div><div class="min-w-0"><p class="text-sm font-semibold truncate">{{ userName }}</p><p class="text-xs text-[#5A6A85]">{{ userRole }}</p></div></div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden"><header class="bg-white border-b border-[#DDE4F0] px-6 h-[60px] flex items-center gap-4 shrink-0"><button (click)="sidebarOpen = true" class="lg:hidden" aria-label="Abrir menu"><i class="bi bi-list text-xl"></i></button><span class="text-sm text-[#5A6A85]">Portal {{ userRole }}</span><button (click)="auth.logout()" class="ml-auto text-sm text-[#1565C0] border border-[#DDE4F0] rounded-lg px-4 py-2">Sair</button></header><p *ngIf="profile.error()" role="alert" class="p-4 text-red-700">{{ profile.error() }} <button (click)="profile.load()" class="underline">Tentar novamente</button></p><main class="flex-1 overflow-y-auto"><router-outlet></router-outlet></main></div>
</div>
