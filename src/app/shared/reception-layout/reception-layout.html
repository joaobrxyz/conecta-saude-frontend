<div class="flex h-screen bg-[#F0F4FA] overflow-hidden" style="font-family: 'Inter', system-ui, sans-serif;">
  
  <div *ngIf="sidebarOpen" class="fixed inset-0 bg-black/30 z-30 lg:hidden" (click)="sidebarOpen = false"></div>
  
  <aside [ngClass]="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed lg:static top-0 left-0 h-full z-40 lg:z-auto flex flex-col w-[232px] bg-white border-r border-[#DDE4F0] shrink-0 transition-transform duration-300">
    <!-- Logo -->
    <div class="flex items-center justify-between px-5 h-[60px] border-b border-[#DDE4F0] shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-[#1565C0]"><i class="bi bi-heart-pulse text-white"></i></div>
        <span class="text-[#0D1B3E] font-bold text-[14px] tracking-tight">Conecta<span class="text-[#16A34A]">Saúde</span></span>
      </div>
      <button (click)="sidebarOpen = false" class="lg:hidden text-[#8A9AB8] hover:text-[#0D1B3E] p-1"><i class="bi bi-x-lg"></i></button>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      <p class="text-[10px] font-semibold text-[#C0CADE] uppercase tracking-widest px-2.5 mb-3">Recepção</p>
      <button *ngFor="let item of navItems" [routerLink]="item.route" (click)="sidebarOpen = false"
              [ngClass]="router.url.includes(item.route) ? 'bg-[#EBF3FF] text-[#1565C0]' : 'text-[#5A6A85] hover:bg-[#F0F4FA] hover:text-[#0D1B3E]'"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium transition-colors text-left group">
        <i [class]="'bi ' + item.icon" [ngClass]="router.url.includes(item.route) ? 'text-[#1565C0]' : 'text-[#9AAAC0] group-hover:text-[#5A6A85]'"></i>
        <span class="flex-1">{{ item.label }}</span>
        <i *ngIf="router.url.includes(item.route)" class="bi bi-chevron-right ml-auto text-xs opacity-60"></i>
      </button>
    </nav>

    <!-- Live Clock Widget -->
    <div class="mx-3 mb-4 p-4 rounded-xl bg-gradient-to-br from-[#0D2B6B] to-[#1565C0]">
      <p class="text-blue-200 text-[10px] font-semibold uppercase tracking-widest mb-1">Horário Atual</p>
      <p class="text-white text-2xl font-bold tracking-tight tabular-nums">{{ clock }}</p>
      <div class="mt-2.5 flex items-center gap-1.5 bg-white/15 rounded-lg px-2.5 py-1.5">
        <i class="bi bi-activity text-emerald-300 text-[11px]"></i>
        <span class="text-white text-[11px] font-semibold">Clínica aberta · Turno tarde</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-4 py-3 border-t border-[#DDE4F0] flex items-center gap-3 shrink-0">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#5A6A85] to-[#9AAAC0] flex items-center justify-center text-white text-[13px] font-bold shrink-0">{{ userInitials }}</div>
      <div class="min-w-0">
        <p class="text-[13px] font-semibold text-[#0D1B3E] truncate leading-tight">{{ userName }}</p>
        <p class="text-[11px] text-[#5A6A85]">{{ userRole }}</p>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Topbar -->
    <header class="bg-white border-b border-[#DDE4F0] flex items-center px-6 gap-4 shrink-0 sticky top-0 z-20 h-[60px]">
      <button (click)="sidebarOpen = true" class="lg:hidden text-[#8A9AB8] hover:text-[#0D1B3E] p-1"><i class="bi bi-list text-lg"></i></button>
      <div class="relative flex-1 max-w-md">
        <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-[#5A6A85]"></i>
        <input [(ngModel)]="query" placeholder="Buscar paciente, CPF ou médico..." class="w-full pl-9 pr-4 py-2 text-[13px] bg-[#F0F4FA] border border-[#DDE4F0] rounded-lg text-[#0D1B3E] placeholder:text-[#5A6A85] outline-none focus:border-[#1565C0]/40 focus:ring-2 focus:ring-[#1565C0]/10 transition">
      </div>
      <div class="ml-auto flex items-center gap-3">
        <div class="relative">
          <button (click)="notifOpen = !notifOpen" class="relative w-9 h-9 flex items-center justify-center rounded-lg border border-[#DDE4F0] hover:bg-[#F0F4FA] transition-colors">
            <i class="bi bi-bell text-[#5A6A85]"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
          </button>
          <!-- Notification Dropdown -->
          <div *ngIf="notifOpen" class="absolute right-0 top-11 w-[300px] bg-white rounded-xl shadow-2xl border border-[rgba(21,101,192,0.1)] z-50 overflow-hidden">
            <div class="px-4 py-3 border-b border-[#F3F6FB] flex items-center justify-between">
              <span class="text-[13px] font-bold text-[#0D1B3E]">Alertas</span>
              <span class="text-[11px] text-[#1565C0] cursor-pointer font-medium">Limpar</span>
            </div>
            <div *ngFor="let n of notifications" class="flex items-start gap-3 px-4 py-3 hover:bg-[#F8FAFD] border-b border-[#F8FAFC] last:border-0 cursor-pointer transition-colors">
              <div class="w-2 h-2 rounded-full mt-1.5 shrink-0" [ngStyle]="{'background': n.color}"></div>
              <div class="flex-1">
                <p class="text-[12px] text-[#0D1B3E] leading-snug">{{ n.text }}</p>
                <p class="text-[10px] text-[#B8C7DC] mt-0.5">{{ n.time }} atrás</p>
              </div>
            </div>
          </div>
        </div>
        <div class="hidden sm:block text-right border-l border-[#DDE4F0] pl-3">
          <p class="text-[13px] font-semibold text-[#0D1B3E] leading-none">{{ userName }}</p>
          <p class="text-[10px] text-[#9AAAC0] leading-none mt-0.5">{{ userRole }}</p>
        </div>
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#5A6A85] to-[#9AAAC0] flex items-center justify-center text-white text-sm font-bold shadow-sm">{{ userInitials }}</div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
